spring.application.name=EventManeger

# MySQL (enable later)
# spring.datasource.url=jdbc:mysql://localhost:3306/event_manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=${DB_USERNAME:root}
# spring.datasource.password=${DB_PASSWORD:root}

spring.datasource.url=jdbc:h2:file:./data/eventmanager;MODE=MySQL;AUTO_SERVER=true;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

app.jwt.secret=${JWT_SECRET:local-dev-only-change-me-32chars-min!}
app.jwt.issuer=event-manager
app.jwt.expiration=1h

app.admin.phone=${ADMIN_PHONE:9999999999}
app.admin.full-name=System Admin
app.admin.email=${ADMIN_EMAIL:admin@eventmanager.local}

app.otp.ttl=5m
app.otp.length=6
app.otp.resend-cooldown=45s
app.otp.max-attempts=5
app.otp.dev-echo=true

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
