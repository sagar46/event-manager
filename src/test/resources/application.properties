spring.datasource.url=jdbc:h2:mem:eventmanager;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-jwt-secret-key-must-be-32chars!
app.jwt.issuer=event-manager-test
app.jwt.expiration=1h

app.admin.phone=9999999999
app.admin.full-name=System Admin
app.admin.email=admin@eventmanager.local

app.otp.ttl=5m
app.otp.dev-echo=true
app.otp.resend-cooldown=0s

app.cors.allowed-origins=http://localhost:3000
